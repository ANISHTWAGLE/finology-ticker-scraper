name: screener-storage
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: screener
      POSTGRES_USER: screener
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - screener_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screener -d screener"]
      interval: 3s
      timeout: 3s
      retries: 20
secrets:
  postgres_password:
    file: ./.secrets/postgres_password
volumes:
  screener_data:
